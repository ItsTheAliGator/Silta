[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silta"
version = "0.1.0"
description = "Share mouse and keyboard input between machines using pure Python."
requires-python = ">=3.9"
dependencies = [
    "pyautogui>=0.9",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = [
    "pyobjc>=9.0",
]

[tool.pytest.ini_options]
addopts = "-q"
python_files = "test_*.py"
